<!DOCTYPE html>
<html>
  <head>
    <title>Egypt AR Explorer</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.0.0/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- AR Scene -->
    <a-scene embedded arjs>
      <!-- الكاميرا -->
      <a-marker preset="hiro">
        <!-- مجسم 3D (gltf أو obj) -->
        <a-entity 
          gltf-model="url(models/sphinx.gltf)" 
          scale="0.5 0.5 0.5" 
          rotation="0 180 0" 
          position="0 0 0">
        </a-entity>
        <!-- نص يظهر فوق الموديل -->
        <a-text 
          value="Sphinx - Guardian of Giza" 
          position="0 1 0" 
          align="center" 
          color="yellow">
        </a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
